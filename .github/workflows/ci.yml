name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Run ingestion & dbt tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest tests/ -v

      - name: Run dbt build
        run: |
          uv run dbt deps
          uv run dbt build --target ci --profiles-dir .
        working-directory: transform
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          DATA_RAW_PATH: ${{ github.workspace }}/data/raw/prices

  publish-dbt-docs:
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps
        working-directory: transform
      
      - name: Generate dbt docs
        run: uv run dbt docs generate --target ci --profiles-dir .
        working-directory: transform
        env:
          DATA_RAW_PATH: ${{ github.workspace }}/data/raw/prices
      
      - name: Publihs on GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: transform/target

