version: 2

models:
  - name: mart_price_summary
    description: >
      Mart model. One row per coin showing the most recent daily data
      including price data, volume, market_cap and moving averages.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [coin_id, date_day]
    columns:
      - name: coin_id
        description: "CoinGecko coin identifier, lowercase"
        data_tests:
          - not_null
          - unique

      - name: date_day
        description: "Data ingestion date"
        data_tests:
          - not_null

      - name: symbol
        description: "Coin ticker, lowercase"
        data_tests:
          - not_null

      - name: name
        description: "Coin name"
        data_tests:
          - not_null

      - name: price_usd
        description: "Coin price in USD"
        data_tests:
          - not_null

      - name: total_volume
        description: "Coin trading volume in USD for the day"
        data_tests:
          - not_null

      - name: market_cap
        description: "Coin market cap in USD"
        data_tests:
          - not_null

      - name: price_change_24h_pct
        description: "Percentage price change for the day"

      - name: ma_7d
        description: "7 day moving average of the close price"
        data_tests:
          - not_null

      - name: ma_30d
        description: "30 day moving average of the close price"
        data_tests:
          - not_null
  - name: mart_ohlcv
    description: >
      Full OHLCV time series. One row per coin per day for whole
      ingested history.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [coin_id, date_day]
    columns:
      - name: coin_id
        description: "CoinGecko coin identifier, lowercase"
        data_tests:
          - not_null

      - name: symbol
        description: "Coin ticker, lowercase"
        data_tests:
          - not_null

      - name: name
        description: "Coin name"
        data_tests:
          - not_null

      - name: date_day
        description: "Data ingestion date"
        data_tests:
          - not_null

      - name: open
        description: "Open price (first data entry of the day)"
        data_tests:
          - not_null

      - name: high
        description: "Highest recorded price of the day"
        data_tests:
          - not_null

      - name: low
        description: "Lowest recorded price of the day"
        data_tests:
          - not_null

      - name: close
        description: "Close price (last data entry of the day)"
        data_tests:
          - not_null

      - name: total_volume
        description: "Coin trading volume in USD for the day"
        data_tests:
          - not_null

      - name: market_cap
        description: "Coin market cap in USD"
        data_tests:
          - not_null

      - name: row_count
        description: "Number of aggregated rows"
        data_tests:
          - not_null