version: 2

exposures:
  - name: prices_api
    label: "GET /prices API endpoint"
    type: application
    maturity: medium
    url: https://github.com/lazarantonijevic/MarketData/blob/main/api/routers/prices.py
    description: >
      FastAPI endpoint serving current price summaries.
      Reads directly from mart_price_summary.
    depends_on:
      - ref('mart_price_summary')
    owner:
      name: lazarantonijevic
  
  - name: ohlcv_api
    label: "GET /ohlcv API endpoint"
    type: application
    maturity: medium
    url: https://github.com/lazarantonijevic/MarketData/blob/main/api/routers/ohlcv.py
    description: >
      FastAPI endpoint serving OHLCV time series.
      Reads from mart_ohlcv.
    depends_on:
      - ref('mart_ohlcv')
    owner:
      name: lazarantonijevic
  
  - name: anomalies_api
    label: "GET /anomalies API endpoint"
    type: application
    maturity: medium
    url: https://github.com/lazarantonijevic/MarketData/blob/main/api/routers/anomalies.py
    description: >
      FastAPI endpoint serving flagged volume anomalies.
      Reads from mart_anomalies.
    depends_on:
      - ref('mart_anomalies')
    owner:
      name: lazarantonijevic
  
  - name: market_data_dashboard
    label: "Streamlit dashboard"
    type: dashboard
    maturity: medium
    url: https://github.com/lazarantonijevic/MarketData/blob/main/dashboard/app.py
    description: >
      Streamlit dashboard displaying price charts, anomaly alerts and
      pipeline health. Consumes all three mart tables via the API layer.
    depends_on:
      - ref('mart_price_summary')
      - ref('mart_ohlcv')
      - ref('mart_anomalies')
    owner:
      name: lazarantonijevic